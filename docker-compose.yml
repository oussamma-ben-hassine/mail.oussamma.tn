version: '3.8'

services:
  mail-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: mail-web:latest
    restart: always
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - API_INTERNAL_URL=http://mail-api:4000
      - NEXT_PUBLIC_API_URL=https://mail.oussamma.tn/api
      - NEXT_PUBLIC_SSO_URL=https://sso-a.oussamma.tn
      - NEXT_PUBLIC_DRIVE_URL=https://drive.oussamma.tn
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/manifest.json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      coolify:
        aliases:
          - mail-web
      internal_net:
        aliases:
          - mail-web

  mail-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: mail-api:latest
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mail_user}:${POSTGRES_PASSWORD:-mail_secret_pass_2026}@mail-postgres:5432/${POSTGRES_DB:-mail_db}?schema=public
      - REDIS_HOST=mail-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mail_redis_pass_2026}
      - APP_CREDENTIAL_ENCRYPTION_KEY=${APP_CREDENTIAL_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - SSO_ISSUER=https://sso-a.oussamma.tn
      - SSO_CLIENT_ID=client_mail_app
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-sec_mail_platform_secret_2026}
      - SSO_REDIRECT_URI=https://mail.oussamma.tn/auth/callback
      - LITELLM_BASE_URL=https://ai.oussamma.tn
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-oussamma-master-gateway-2026}
      - DRIVE_BASE_URL=https://drive.oussamma.tn
      - SUPERVISOR_BASE_URL=https://supervisor.oussamma.tn
      - SUPERVISOR_KEY=${SUPERVISOR_KEY:-sup_key_mail_2026}
      - MAIL_DELIVERY_MODE=${MAIL_DELIVERY_MODE:-simulated}
      - MAIL_SMTP_HOST=mailu-front
      - MAIL_SMTP_PORT=587
      - MAIL_IMAP_HOST=mailu-front
      - MAIL_IMAP_PORT=993
    command: sh -c "pnpm exec prisma db push --schema=./prisma/schema.prisma --skip-generate && node apps/api/dist/main.js"
    ports:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - mail-postgres
      - mail-redis
    networks:
      coolify:
        aliases:
          - mail-api
      internal_net:
        aliases:
          - mail-api

  mail-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: mail-worker:latest
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mail_user}:${POSTGRES_PASSWORD:-mail_secret_pass_2026}@mail-postgres:5432/${POSTGRES_DB:-mail_db}?schema=public
      - REDIS_HOST=mail-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mail_redis_pass_2026}
      - SUPERVISOR_BASE_URL=https://supervisor.oussamma.tn
      - SUPERVISOR_KEY=${SUPERVISOR_KEY:-sup_key_mail_2026}
      - NOTIFICATION_HUB_URL=${NOTIFICATION_HUB_URL:-https://notification.oussamma.tn/api/v1/events}
      - NOTIFICATION_WEBHOOK_SECRET=${NOTIFICATION_WEBHOOK_SECRET:-notif_secret_2026}
      - MAIL_DELIVERY_MODE=${MAIL_DELIVERY_MODE:-simulated}
      - MAIL_SMTP_HOST=mailu-front
      - MAIL_SMTP_PORT=587
    depends_on:
      - mail-postgres
      - mail-redis
    networks:
      - internal_net

  mail-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mail_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mail_db}
    volumes:
      - mail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mail_user} -d ${POSTGRES_DB:-mail_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  mail-redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mail_redis_pass_2026}"]
    volumes:
      - mail_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mail_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

volumes:
  mail_postgres_data:
  mail_redis_data:

networks:
  internal_net:
    driver: bridge
  coolify:
    external: true
